        <button style="width: 100%; box-sizing: border-box; height: 60px; padding: 0 12px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
          <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: rgba(255,255,255,0.06); color: #c8d3df; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 300px">Flank-brand-assets.zip</span><span style="font-size: 11.5px; color: #8b9bb0">File · 1 hr ago</span></span>

          <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: rgba(255,255,255,0.06); color: #c8d3df; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>

      <div style="display: flex; gap: 10px">
        <button style="flex: 1; height: 44px; border: 0; border-radius: 12px; background: {{accent}}; color: #04201c; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">Copy to clipboard

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5EEAD4","options":["#5EEAD4","#7DD3FC","#C4B5FD","#FDBA74"]},"$preview":{"width":1040,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#5EEAD4';
    let h = a.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return {
      accent: a,
      accentSoft: 'rgba(' + r + ',' + g + ',' + b + ',0.14)',
      accentLine: 'rgba(' + r + ',' + g + ',' + b + ',0.38)'
    };
  }
}
</script>
