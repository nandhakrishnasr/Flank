<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flank Paper Theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 720px; height: 520px; overflow: hidden; font-family: 'Inter','Segoe UI',system-ui,sans-serif; color: #1f1e1b; background: #ece9e2">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(520px 380px at 18% 14%, rgba(246,208,182,0.9), rgba(246,208,182,0) 70%), radial-gradient(480px 420px at 92% 92%, rgba(190,208,247,0.9), rgba(190,208,247,0) 70%), #ece9e2"></div>

<!-- context window -->
<div aria-hidden="true" style="position: absolute; left: 48px; top: 44px; width: 380px; height: 250px; border-radius: 12px; background: #fbfaf7; border: 1px solid #e2ded4; box-shadow: 0 16px 40px rgba(60,50,30,0.12); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
  <div style="height: 10px; width: 140px; border-radius: 5px; background: #d9d4c7"></div>
  <div style="height: 8px; width: 300px; border-radius: 4px; background: #ebe7dd"></div>
  <div style="height: 8px; width: 260px; border-radius: 4px; background: #ebe7dd"></div>
  <div style="height: 8px; width: 280px; border-radius: 4px; background: #ebe7dd"></div>
  <div style="height: 8px; width: 180px; border-radius: 4px; background: #ebe7dd"></div>
</div>

<!-- DOCK -->
<nav aria-label="Flank dock" style="position: absolute; right: 14px; top: 56px; width: 60px; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 20px; background: #fbfaf7; border: 1px solid #e2ded4; box-shadow: 0 14px 34px rgba(60,50,30,0.16)">
  <button aria-label="Terminal" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: #34322e; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg></button>
  <button aria-label="Browser" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: #34322e; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/></svg></button>
  <button aria-label="Files" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: #34322e; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button aria-label="Notes" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: #34322e; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></button>
  <div aria-hidden="true" style="width: 24px; height: 1px; background: #e2ded4"></div>
  <button aria-label="Clipboard history, 24 items" style="position: relative; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: #34322e; display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg>
    <span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: {{accent}}; color: #ffffff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">24</span>
  </button>
  <button aria-label="Weather, open" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #1f1e1b; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span style="font-size: 10.5px; font-weight: 600">24°</span>
  </button>
  <button aria-label="CPU 23 percent" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: #34322e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
    <span style="font-size: 10.5px; font-weight: 600">23%</span>
    <span style="width: 22px; height: 3px; border-radius: 2px; background: #dcd7ca; display: block; overflow: hidden"><span style="display: block; width: 23%; height: 100%; background: {{accent}}"></span></span>
  </button>
  <button aria-label="Mini player" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: #f1eee7; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="3.5" height="10" rx="1.2"/><rect x="10.2" y="4" width="3.5" height="16" rx="1.2"/><rect x="16.5" y="8" width="3.5" height="12" rx="1.2"/></svg></button>
</nav>

<!-- WEATHER CARD -->
<section aria-label="Weather" style="position: absolute; right: 84px; top: 214px; width: 292px; box-sizing: border-box; padding: 18px; border-radius: 20px; background: #fbfaf7; border: 1px solid #e2ded4; box-shadow: 0 18px 44px rgba(60,50,30,0.18); display: flex; flex-direction: column; gap: 14px">
  <div aria-hidden="true" style="position: absolute; right: -7px; top: 123px; width: 12px; height: 12px; background: #fbfaf7; border-top: 1px solid #e2ded4; border-right: 1px solid #e2ded4; transform: rotate(45deg)"></div>
  <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 600; color: #6b665c">Kyoto</span><span style="font-size: 12px; color: #6b665c">Now</span></div>
  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <span style="font-family: 'Fraunces', Georgia, serif; font-size: 64px; line-height: 0.95; font-weight: 400; letter-spacing: -0.02em">24°</span>
    <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 6px"><span style="font-size: 15px; font-weight: 500">Sunny</span><span style="font-size: 12.5px; color: #6b665c">H 29°  L 18°</span></span>
  </div>
  <div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid #e8e4da">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #6b665c"><span>4 PM</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1e1b" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span style="font-size: 13px; font-weight: 600; color: #1f1e1b">24°</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #6b665c"><span>5 PM</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1e1b" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span style="font-size: 13px; font-weight: 600; color: #1f1e1b">23°</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #6b665c"><span>6 PM</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1e1b" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span style="font-size: 13px; font-weight: 600; color: #1f1e1b">21°</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #6b665c"><span>7 PM</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1e1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span style="font-size: 13px; font-weight: 600; color: #1f1e1b">19°</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #6b665c"><span>8 PM</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1e1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span style="font-size: 13px; font-weight: 600; color: #1f1e1b">18°</span></div>
  </div>
</section>

<!-- taskbar -->
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; box-sizing: border-box; background: rgba(251,250,247,0.78); backdrop-filter: blur(20px); border-top: 1px solid #e2ded4; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: #34322e">
  <span style="width: 90px"></span>
  <span style="display: flex; gap: 14px; align-items: center">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </span>
  <span style="width: 90px; text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums">4:24 PM</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BFF","options":["#2F4BFF","#0F766E","#C2410C","#7C3AED"]},"$preview":{"width":720,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F4BFF' };
  }
}
</script>
</body>
</html>
