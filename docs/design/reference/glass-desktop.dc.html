<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flank Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Inter','Segoe UI',system-ui,sans-serif; color: #e8edf2; background: #0a0e13">

<!-- wallpaper -->
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(900px 620px at 16% 10%, rgba(52,92,156,0.5), rgba(52,92,156,0) 62%), radial-gradient(820px 720px at 88% 92%, rgba(24,132,124,0.34), rgba(24,132,124,0) 62%), #0a0e13"></div>

<!-- background app window (context only) -->
<div aria-hidden="true" style="position: absolute; left: 96px; top: 72px; width: 880px; height: 580px; border-radius: 12px; background: rgba(23,28,35,0.94); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 30px 80px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06)">
    <span style="font-size: 12px; color: #9fb0c3">main.rs — flank-core</span>
    <span style="display: flex; gap: 18px; color: #9fb0c3">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 6h10"/></svg>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/></svg>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg>
    </span>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <div style="width: 210px; flex: none; border-right: 1px solid rgba(255,255,255,0.06); padding: 16px 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="height: 8px; width: 90px; border-radius: 4px; background: #2d3a4b"></div>
      <div style="height: 8px; width: 130px; border-radius: 4px; background: #263243"></div>
      <div style="height: 8px; width: 110px; border-radius: 4px; background: #263243"></div>
      <div style="height: 8px; width: 70px; border-radius: 4px; background: #2d3a4b"></div>
      <div style="height: 8px; width: 120px; border-radius: 4px; background: #263243"></div>
      <div style="height: 8px; width: 100px; border-radius: 4px; background: #263243"></div>
      <div style="height: 8px; width: 80px; border-radius: 4px; background: #2d3a4b"></div>
    </div>
    <div style="flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 9px">
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">1</span><div style="height: 8px; width: 60px; border-radius: 4px; background: #5b4a86"></div><div style="height: 8px; width: 150px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">2</span><div style="height: 8px; width: 60px; border-radius: 4px; background: #5b4a86"></div><div style="height: 8px; width: 210px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">3</span></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">4</span><div style="height: 8px; width: 44px; border-radius: 4px; background: #3f6f8f"></div><div style="height: 8px; width: 120px; border-radius: 4px; background: #c1883f; opacity: 0.8"></div><div style="height: 8px; width: 70px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">5</span><div style="width: 20px"></div><div style="height: 8px; width: 90px; border-radius: 4px; background: #3f6f8f"></div><div style="height: 8px; width: 180px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">6</span><div style="width: 20px"></div><div style="height: 8px; width: 130px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">7</span><div style="width: 20px"></div><div style="height: 8px; width: 70px; border-radius: 4px; background: #5b4a86"></div><div style="height: 8px; width: 160px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">8</span><div style="width: 40px"></div><div style="height: 8px; width: 200px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">9</span><div style="width: 20px"></div><div style="height: 8px; width: 28px; border-radius: 4px; background: #3f6f8f"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">10</span></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">11</span><div style="height: 8px; width: 60px; border-radius: 4px; background: #5b4a86"></div><div style="height: 8px; width: 170px; border-radius: 4px; background: #2d3a4b"></div></div>
      <div style="display: flex; gap: 10px; align-items: center; height: 14px"><span style="width: 18px; text-align: right; font-size: 11px; color: #5a6878">12</span><div style="width: 20px"></div><div style="height: 8px; width: 110px; border-radius: 4px; background: #c1883f; opacity: 0.8"></div><div style="height: 8px; width: 90px; border-radius: 4px; background: #2d3a4b"></div></div>
    </div>
  </div>
</div>

<!-- FLANK DOCK -->
<nav aria-label="Flank dock" style="position: absolute; right: 12px; top: 150px; width: 68px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 24px; background: rgba(20,25,32,0.62); backdrop-filter: blur(28px) saturate(140%); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06)">

  <button aria-label="Terminal" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>
  </button>
  <button aria-label="Browser" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/></svg>
  </button>
  <button aria-label="Files" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button aria-label="Notes" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
  </button>
  <button aria-label="Pinned link: project board" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18l-5-4-5 4z"/></svg>
  </button>

  <div aria-hidden="true" style="width: 28px; height: 1px; background: rgba(255,255,255,0.12)"></div>

  <button aria-label="Clipboard history, 24 items" style="position: relative; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9.5 11h5M9.5 15h3"/></svg>
    <span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: {{accent}}; color: #04201c; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">24</span>
  </button>
  <button aria-label="Weather, 24 degrees" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span style="font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">24°</span>
  </button>
  <button aria-label="System stats, open" style="width: 44px; height: 44px; padding: 0; border-radius: 12px; background: {{accentSoft}}; border: 1px solid {{accentLine}}; color: #e8edf2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
    <span style="font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">23%</span>
    <span style="width: 26px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14); display: block; overflow: hidden"><span style="display: block; width: 23%; height: 100%; background: {{accent}}"></span></span>
  </button>
  <button aria-label="Mini player, playing" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: {{accent}}; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="3.5" height="10" rx="1.2"/><rect x="10.2" y="4" width="3.5" height="16" rx="1.2"/><rect x="16.5" y="8" width="3.5" height="12" rx="1.2"/></svg>
  </button>
  <button aria-label="AI usage, 68 percent" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: rgba(255,255,255,0.04); color: #d3dce7; display: flex; align-items: center; justify-content: center">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="10" stroke="rgba(255,255,255,0.14)" stroke-width="3"/><circle cx="14" cy="14" r="10" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="42.7 62.8" transform="rotate(-90 14 14)"/><text x="14" y="17.2" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" font-family="Inter, sans-serif">68</text></svg>
  </button>
</nav>

<!-- STATS CARD (slides out from the dock on hover) -->
<section aria-label="System stats" style="position: absolute; right: 90px; top: 380px; width: 304px; box-sizing: border-box; padding: 18px 18px 16px; border-radius: 20px; background: rgba(20,25,32,0.8); backdrop-filter: blur(28px) saturate(140%); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 28px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px">
  <div aria-hidden="true" style="position: absolute; right: -7px; top: 169px; width: 12px; height: 12px; background: rgb(22,28,35); border-top: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); transform: rotate(45deg)"></div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 14px; font-weight: 600">System</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #9fb0c3"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}; display: block"></span>Live · every 1s</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 11px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #9fb0c3">CPU</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">23%</span></div>
      <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden"><div style="width: 23%; height: 100%; background: {{accent}}"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #9fb0c3">Memory</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">11.4 / 32 GB</span></div>
      <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden"><div style="width: 36%; height: 100%; background: {{accent}}"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #9fb0c3">GPU</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">8%</span></div>
      <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden"><div style="width: 8%; height: 100%; background: {{accent}}"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #9fb0c3">Disk (C:)</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">412 / 953 GB</span></div>
      <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden"><div style="width: 43%; height: 100%; background: {{accent}}"></div></div>
    </div>
  </div>

  <div style="border-radius: 12px; background: rgba(255,255,255,0.04); padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 11.5px; color: #9fb0c3">CPU, last 60 seconds</span>
    <svg width="100%" height="52" viewBox="0 0 264 52" preserveAspectRatio="none" role="img" aria-label="CPU usage over the last 60 seconds, hovering around 20 to 30 percent"><path d="M0 34 L18 30 L36 32 L54 22 L72 26 L90 16 L108 24 L126 20 L144 28 L162 12 L180 18 L198 10 L216 22 L234 14 L264 18 L264 52 L0 52 Z" fill="{{accentSoft}}"/><path d="M0 34 L18 30 L36 32 L54 22 L72 26 L90 16 L108 24 L126 20 L144 28 L162 12 L180 18 L198 10 L216 22 L234 14 L264 18" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </div>

  <div style="display: flex; gap: 10px">
    <div style="flex: 1; border-radius: 12px; background: rgba(255,255,255,0.04); padding: 9px 11px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11.5px; color: #9fb0c3">Download</span><span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">2.4 MB/s</span></div>
    <div style="flex: 1; border-radius: 12px; background: rgba(255,255,255,0.04); padding: 9px 11px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11.5px; color: #9fb0c3">Upload</span><span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">310 KB/s</span></div>
  </div>

  <button style="height: 40px; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; background: transparent; color: #e8edf2; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">Open full stats
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
  </button>
</section>

<!-- TASKBAR -->
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; box-sizing: border-box; background: rgba(16,20,26,0.8); backdrop-filter: blur(24px); border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: space-between; padding: 0 14px">
  <div style="width: 160px"></div>
  <div style="display: flex; align-items: center; gap: 6px; color: #dbe3ec">
    <span style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span>
    <span style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
    <span style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="13" height="10" rx="2"/><rect x="8" y="10" width="13" height="10" rx="2"/></svg></span>
    <span style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
    <span style="position: relative; width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/></svg><span style="position: absolute; bottom: 2px; left: 13px; width: 14px; height: 3px; border-radius: 2px; background: {{accent}}"></span></span>
    <span style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg></span>
  </div>
  <div style="width: 160px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; color: #dbe3ec">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="0.8" fill="currentColor"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    <span style="display: flex; flex-direction: column; align-items: flex-end; font-size: 11.5px; line-height: 1.25; font-variant-numeric: tabular-nums"><span>4:24 PM</span><span style="color: #9fb0c3">11/3/2026</span></span>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5EEAD4","options":["#5EEAD4","#7DD3FC","#C4B5FD","#FDBA74"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#5EEAD4';
    let h = a.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return {
      accent: a,
      accentSoft: 'rgba(' + r + ',' + g + ',' + b + ',0.14)',
      accentLine: 'rgba(' + r + ',' + g + ',' + b + ',0.38)'
    };
  }
}
