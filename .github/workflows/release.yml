name: Build and Release Flank

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Flank Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Frontend Bundle
        run: npm run build:ui

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller pywin32 pillow psutil urllib3

      - name: Build Executable & Setup Installer
        run: python scripts/build_executable.py

      - name: Zip Standalone Distribution
        run: |
          Compress-Archive -Path dist\Flank\* -DestinationPath dist\Flank-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Flank-Setup.exe
            dist/Flank-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
