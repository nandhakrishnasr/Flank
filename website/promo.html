<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flank — Launch Video (1920×1080 60fps)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFAF7;
    --bg2: #F3F1EA;
    --surface: #FFFFFF;
    --fg: #1F1E1B;
    --muted: #625E55;
    --line: rgba(31, 30, 27, 0.12);
    --grid-line: rgba(31, 30, 27, 0.13);
    --blue: #76B9FF;
    --blue-deep: #539DF5;
    --brand-blue: #2F4BFF;
    --amber: #F5A524;
    --danger: #D93829;
    --ok: #14804A;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #111;
    font-family: var(--font);
    color: var(--fg);
  }

  #viewport {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    overflow: hidden;
    transform-origin: 0 0;
  }

  /* Architectural Blueprint 3x3 Dashed Grid */
  .blueprint-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .grid-v, .grid-h {
    position: absolute;
    background: none;
  }
  .grid-v {
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1.5px dashed var(--grid-line);
  }
  .grid-h {
    left: 0;
    right: 0;
    height: 0;
    border-top: 1.5px dashed var(--grid-line);
  }
  .grid-node {
    position: absolute;
    width: 11px;
    height: 11px;
    transform: translate(-50%, -50%);
  }
  .grid-node::before, .grid-node::after {
    content: "";
    position: absolute;
    background: rgba(31, 30, 27, 0.32);
  }
  .grid-node::before {
    left: 5px; top: 1px; width: 1.5px; height: 9px;
  }
  .grid-node::after {
    top: 5px; left: 1px; height: 1.5px; width: 9px;
  }

  /* Scene layers */
  .scene {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
  }
  .scene.active {
    display: flex;
  }

  /* Highlighted word pill (matches reference video stacked blue box) */
  .hl-box {
    position: relative;
    display: inline-block;
    background: var(--blue);
    color: var(--fg);
    padding: 2px 16px 6px 16px;
    margin: 0 4px;
    line-height: 1.08;
    box-shadow: 6px 6px 0px rgba(83, 157, 245, 0.55);
  }
  .hl-box.tight {
    padding: 0px 14px 4px 14px;
  }

  /* Selection node corners */
  .sel-frame {
    position: relative;
    border: 1.5px solid #4A90E2;
  }
  .sel-node {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #FFFFFF;
    border: 1.5px solid #357ABD;
  }
  .sel-node.tl { top: -5px; left: -5px; }
  .sel-node.tr { top: -5px; right: -5px; }
  .sel-node.bl { bottom: -5px; left: -5px; }
  .sel-node.br { bottom: -5px; right: -5px; }

  /* Split layout (Left copy at col 1, Right showcase spanning cols 2-3) */
  .split-left {
    position: absolute;
    left: 140px;
    top: 50%;
    transform: translateY(-50%);
    width: 580px;
    z-index: 10;
  }
  .split-left h2 {
    font-size: 62px;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1.12;
    color: var(--fg);
  }
  .split-right {
    position: absolute;
    left: 740px;
    top: 50%;
    transform: translateY(-50%);
    width: 1040px;
    height: 640px;
    z-index: 10;
  }

  /* Blueprint Browser / Showcase Window */
  .bp-win {
    position: relative;
    width: 100%;
    height: 100%;
    background: #F4F3EF;
    border: 1.5px solid rgba(31, 30, 27, 0.14);
    box-shadow: 0 24px 60px rgba(31, 30, 27, 0.08);
    display: flex;
    flex-direction: column;
  }
  .bp-titlebar {
    height: 46px;
    border-bottom: 1px solid rgba(31, 30, 27, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.6);
    flex: none;
  }
  .bp-dots {
    display: flex;
    gap: 8px;
  }
  .bp-dots i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid rgba(31, 30, 27, 0.35);
    display: block;
  }
  .bp-body {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .bp-tag {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    padding: 4px 12px;
    background: var(--blue);
    color: var(--fg);
    border-radius: 3px;
  }
  .bp-tag.red {
    background: #D93829;
    color: #fff;
  }
  .bp-tag.green {
    background: #14804A;
    color: #fff;
  }

  /* Embedded Flank UI inside showcase windows */
  .fk-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .fk-stage[data-wall="aurora"] {
    background:
      radial-gradient(620px 480px at 12% 10%, #ff4f9a, transparent 70%),
      radial-gradient(660px 520px at 78% 8%, #7a5cff, transparent 70%),
      radial-gradient(720px 580px at 24% 104%, #00c6be, transparent 70%),
      radial-gradient(620px 520px at 104% 66%, #ff9640, transparent 70%),
      #0b1030;
  }
  .fk-stage[data-wall="meadow"] {
    background:
      radial-gradient(640px 500px at 12% 6%, #f6d3b0, transparent 70%),
      radial-gradient(680px 520px at 88% 8%, #bcd2f5, transparent 70%),
      radial-gradient(700px 560px at 30% 108%, #cfe6c4, transparent 70%),
      #f1ede3;
  }
  .fk-stage[data-wall="sunset"] {
    background:
      radial-gradient(680px 500px at 20% 0%, #ffcf8a, transparent 68%),
      radial-gradient(700px 560px at 90% 30%, #ff6a88, transparent 70%),
      radial-gradient(760px 560px at 40% 110%, #5b3cc4, transparent 70%),
      #2a1646;
  }
  .fk-stage[data-wall="graphite"] {
    background:
      radial-gradient(640px 500px at 80% 0%, #3a4254, transparent 70%),
      radial-gradient(600px 480px at 10% 100%, #26303f, transparent 70%),
      #12151b;
  }

  /* Flank Dock & Flyout Cards */
  .fk-dock {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    width: 68px;
    padding: 10px 8px;
    border-radius: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    z-index: 6;
    transition: none;
  }
  .fk-theme-liquid .fk-dock,
  .fk-theme-liquid .fk-flyout {
    background: rgba(18, 22, 46, 0.34);
    backdrop-filter: blur(22px) saturate(1.7);
    border: 1.5px solid rgba(255, 255, 255, 0.38);
    box-shadow: 0 20px 50px rgba(0, 0, 15, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    color: #FFFFFF;
  }
  .fk-theme-paper .fk-dock,
  .fk-theme-paper .fk-flyout {
    background: #FBFAF7;
    border: 1.5px solid #E1DDD2;
    box-shadow: 0 18px 42px rgba(20, 20, 30, 0.18), 0 2px 6px rgba(20, 20, 30, 0.08);
    color: #1F1E1B;
  }
  .fk-theme-aurora .fk-dock,
  .fk-theme-aurora .fk-flyout {
    background: rgba(30, 18, 72, 0.56);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1.5px solid rgba(220, 200, 255, 0.42);
    box-shadow: 0 20px 50px rgba(10, 0, 40, 0.5);
    color: #FFFFFF;
  }
  .fk-theme-nord .fk-dock,
  .fk-theme-nord .fk-flyout {
    background: #2E3440;
    border: 1.5px solid #434C5E;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.48);
    color: #ECEFF4;
  }
  .fk-theme-terminal .fk-dock,
  .fk-theme-terminal .fk-flyout {
    background: #0A100A;
    border: 1.5px solid #1F3D1F;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.65);
    color: #8CFF8C;
    font-family: var(--mono);
  }

  .fk-tile {
    width: 50px;
    height: 46px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 600;
    position: relative;
  }
  .fk-tile.active {
    background: rgba(255, 255, 255, 0.22);
  }
  .fk-theme-paper .fk-tile.active {
    background: rgba(31, 30, 27, 0.1);
  }
  .fk-tile.active::after {
    content: "";
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 3.5px;
    height: 18px;
    border-radius: 2px;
    background: #76B9FF;
  }
  .fk-theme-paper .fk-tile.active::after {
    background: #D95D39;
  }
  .fk-app-plate {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.2);
  }
  .fk-sep {
    width: 26px;
    height: 1px;
    background: currentColor;
    opacity: 0.22;
    margin: 4px 0;
  }
  .fk-flyout {
    position: absolute;
    right: 108px;
    top: 50%;
    transform: translateY(-50%);
    width: 330px;
    padding: 20px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 6;
  }

  /* Pixel Mosaic Overlay Canvas */
  #wipeCanvas {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
    z-index: 50;
  }

  /* Subtle Web Player Controls (hidden during headless capture) */
  #playerControls {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(31, 30, 27, 0.88);
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 13px;
    backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.2s;
  }
  body:hover #playerControls {
    opacity: 1;
  }
  body.headless #playerControls {
    display: none !important;
  }
</style>
</head>
<body>
<div id="viewport">
  <!-- Blueprint 3x3 Grid -->
  <div class="blueprint-grid" id="bpGrid">
    <div class="grid-v" style="left: 640px;"></div>
    <div class="grid-v" style="left: 1280px;"></div>
    <div class="grid-h" style="top: 360px;"></div>
    <div class="grid-h" style="top: 720px;"></div>
    <div class="grid-node" style="left: 640px; top: 360px;"></div>
    <div class="grid-node" style="left: 1280px; top: 360px;"></div>
    <div class="grid-node" style="left: 640px; top: 720px;"></div>
    <div class="grid-node" style="left: 1280px; top: 720px;"></div>
  </div>

  <!-- Dynamic Scene Container -->
  <div id="sceneRoot" style="position:absolute;inset:0;z-index:10;"></div>

  <!-- Pixel Mosaic Wipe Canvas -->
  <canvas id="wipeCanvas" width="1920" height="1080"></canvas>
</div>

<div id="playerControls">
  <button id="playPauseBtn" style="background:none;border:0;color:#fff;cursor:pointer;font-weight:700;">PAUSE</button>
  <input id="scrubInput" type="range" min="0" max="35.05" step="0.016" value="0" style="width:320px;">
  <span id="timeLabel">00.0s / 35.0s</span>
</div>

<script>
(() => {
  "use strict";

  const DURATION = 35.05;
  const sceneRoot = document.getElementById("sceneRoot");
  const wipeCanvas = document.getElementById("wipeCanvas");
  const ctx = wipeCanvas.getContext("2d");
  const viewport = document.getElementById("viewport");

  // Auto-scale viewport when viewed in a smaller browser window
  function fitWindow() {
    if (document.body.classList.contains("headless")) {
      viewport.style.transform = "none";
      return;
    }
    const sx = window.innerWidth / 1920;
    const sy = window.innerHeight / 1080;
    const s = Math.min(sx, sy);
    viewport.style.transform = `scale(${s})`;
  }
  window.addEventListener("resize", fitWindow);
  fitWindow();

  // Brand SVGs (Capsule F Icon + Flank Wordmark)
  const BRAND_ICON = (size = 64) => `
    <svg width="${size}" height="${size}" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="border-radius:${Math.round(size*0.23)}px;box-shadow:0 8px 24px rgba(47,75,255,0.28);flex:none;">
      <rect width="128" height="128" rx="30" fill="#2F4BFF"/>
      <g transform="translate(28.00 17.92) scale(0.72)">
        <path d="M12 44 a38 38 0 0 1 76 0 V84 a38 38 0 0 1 -76 0 Z" fill="none" stroke="#fff" stroke-width="9"/>
        <path d="M37 42 a4 4 0 0 1 4 -4 H62 a7 7 0 0 1 0 14 H51 V60 H60 a6 6 0 0 1 0 12 H51 V86 a4 4 0 0 1 -4 4 H41 a4 4 0 0 1 -4 -4 Z" fill="#fff"/>
      </g>
    </svg>`;

  const BRAND_WORDMARK = (height = 74, color = "#1F1E1B") => `
    <svg height="${height}" viewBox="-2 0 241.5 100" xmlns="http://www.w3.org/2000/svg" style="width:auto;display:block;">
      <path d="M37.744140625 26.4375H27.1484375V23.654296875C27.1484375 19.748046875 28.61328125 18.234375 32.6171875 18.234375H37.744140625V5.24609375H28.369140625C16.11328125 5.24609375 10.302734375 10.2265625 10.302734375 20.724609375V26.4375H0.927734375V39.42578125H10.302734375V78.0H27.1484375V39.42578125H37.744140625Z M56.181640625 5.24609375H39.384765625V78.0H56.181640625Z M76.328125 78.87890625C83.603515625 78.87890625 88.2421875 76.33984375 91.318359375 70.7734375H91.513671875V78.0H107.919921875V43.283203125C107.919921875 31.90625 99.66796875 25.314453125 84.677734375 25.314453125C69.736328125 25.314453125 61.2890625 31.955078125 60.556640625 43.13671875H76.181640625C76.5234375 39.62109375 79.404296875 37.375 84.091796875 37.375C88.53515625 37.375 91.26953125 39.474609375 91.26953125 42.55078125V42.794921875C91.26953125 45.87109375 87.900390625 46.603515625 78.671875 47.384765625C67.685546875 48.263671875 58.65234375 52.0234375 58.65234375 63.595703125C58.65234375 73.849609375 66.025390625 78.87890625 76.328125 78.87890625ZM81.455078125 67.892578125C77.353515625 67.892578125 74.5703125 65.98828125 74.5703125 62.814453125C74.5703125 59.4453125 77.79296875 57.58984375 82.28515625 56.90625C86.435546875 56.22265625 89.609375 55.587890625 91.416015625 54.7578125V59.4453125C91.416015625 64.5234375 87.0703125 67.892578125 81.455078125 67.892578125Z M129.091796875 49.97265625C129.091796875 42.94140625 132.509765625 39.669921875 137.83203125 39.669921875C143.154296875 39.669921875 146.23046875 42.990234375 146.23046875 49.09375V78.0H163.02734375V45.578125C163.02734375 32.8828125 156.484375 25.314453125 145.302734375 25.314453125C137.5390625 25.314453125 132.314453125 28.87890625 128.896484375 34.787109375V26.4375H112.294921875V78.0H129.091796875Z M167.40234375 78.0H184.19921875V62.66796875L187.763671875 58.517578125L200.8984375 78.0H220.283203125L200.263671875 48.947265625L219.453125 26.4375H200.068359375L184.39453125 44.748046875H184.19921875V5.24609375H167.40234375Z" fill="${color}"/>
      <circle cx="230.00" cy="70.50" r="7.50" fill="#F5A524"/>
    </svg>`;

  const IC = {
    terminal: '<path d="m5 7 5 5-5 5"/><path d="M12 18h7"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    weather: '<path d="M7 18a4 4 0 0 1-.4-8A5.5 5.5 0 0 1 17 8.6 4.7 4.7 0 0 1 17 18z"/>',
    battery: '<rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 11v2"/>',
    audio: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/>',
    focus: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    agenda: '<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    stats: '<rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
    clipboard: '<rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9 4h6v3H9z"/>'
  };
  const svgIcon = (name, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[name] || ""}</svg>`;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const easeOutCubic = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);

  function renderDockHTML(activeWidget = "weather") {
    const items = [
      { id: "terminal", kind: "app", icon: "terminal", hue: "#1F2937" },
      { id: "browser", kind: "app", icon: "globe", hue: "#2F4BFF" },
      { id: "files", kind: "app", icon: "folder", hue: "#D98A0B" },
      { sep: true },
      { id: "weather", kind: "w", icon: "weather", val: "24°" },
      { id: "battery", kind: "w", icon: "battery", val: "80%" },
      { id: "audio", kind: "w", icon: "audio", val: "68%" },
      { id: "focus", kind: "w", icon: "focus", val: "25m" },
      { id: "clock", kind: "w", icon: "clock", val: "14:48" },
      { id: "agenda", kind: "w", icon: "agenda", val: "15:00" },
      { id: "stats", kind: "w", icon: "stats", val: "14%" }
    ];
    return `<div class="fk-dock">
      ${items.map(it => {
        if (it.sep) return `<div class="fk-sep"></div>`;
        if (it.kind === "app") {
          return `<div class="fk-tile"><div class="fk-app-plate" style="background:${it.hue}">${svgIcon(it.icon, 17)}</div></div>`;
        }
        return `<div class="fk-tile ${it.id === activeWidget ? "active" : ""}">${svgIcon(it.icon, 19)}<span>${it.val}</span></div>`;
      }).join("")}
    </div>`;
  }

  function renderFlyoutHTML(kind = "weather") {
    if (kind === "weather") {
      return `<div class="fk-flyout">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b style="font-size:17px;">Kyoto</b>
          <span style="font-size:13px;opacity:0.8;display:inline-flex;align-items:center;gap:6px;"><i style="width:7px;height:7px;border-radius:50%;background:#76B9FF;display:inline-block;"></i>Now</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;">
          <div style="font-size:52px;font-weight:700;line-height:1;letter-spacing:-0.04em;">24°</div>
          <div style="text-align:right;font-size:13px;opacity:0.85;"><b style="display:block;font-size:15px;">Partly cloudy</b>H 27° · L 18°</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px;">
          ${[["Now","24°"],["15:00","26°"],["16:00","27°"],["17:00","25°"],["18:00","22°"]].map(c =>
            `<div style="background:rgba(128,128,150,0.18);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;">
              <div style="opacity:0.75;margin-bottom:4px;">${c[0]}</div>
              <b style="font-size:14px;">${c[1]}</b>
            </div>`
          ).join("")}
        </div>
      </div>`;
    }
    if (kind === "focus") {
      return `<div class="fk-flyout">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b style="font-size:17px;">Focus timer</b>
          <span style="font-size:13px;opacity:0.8;display:inline-flex;align-items:center;gap:6px;"><i style="width:7px;height:7px;border-radius:50%;background:#D95D39;display:inline-block;"></i>Deep focus</span>
        </div>

  //Deterministic Pixel Block Wipe Renderer
  function drawPixelWipe(progress, direction = "rtl", fillBlue = false) {
    ctx.clearRect(0, 0, 1920, 1080);
    if (progress <= 0 || progress >= 1) return;

    const cols = 32;
    const rows = 18;
    const cw = 1920 / cols;
    const rh = 1080 / rows;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        // Pseudo-random deterministic noise per cell
        const hash = Math.sin((r * 73 + c * 37) * 12.9898) * 43758.5453;
        const jitter = (hash - Math.floor(hash)) * 0.28;
        const normX = direction === "rtl" ? (cols - 1 - c) / cols : c / cols;

        // Wave curve: sweeps across from 0..0.5, then clears 0.5..1.0
        const enterAt = normX * 0.45 + jitter * 0.35;
        const exitAt = enterAt + 0.38;

        if (progress >= enterAt && progress <= exitAt) {
          ctx.fillStyle = "#76B9FF";
          ctx.fillRect(c * cw, r * rh, cw + 1, rh + 1);
        } else if (fillBlue && progress > exitAt) {
          ctx.fillStyle = "#76B9FF";
          ctx.fillRect(c * cw, r * rh, cw + 1, rh + 1);
        }
      }
    }
  }

      let showInspectBoxes = false;

      if (t < 16.50) {
        leftText = `It <span class="hl-box">adapts</span><br>to your desktop.`;
        passLabel = "paper vs liquid";
      } else if (t < 17.50) {
        leftText = `<span class="hl-box">Samples</span><br>your wallpaper.`;
        passLabel = "contrast check";
        showInspectBoxes = true;
      } else {
        leftText = `<span class="hl-box">Matches</span><br>every pixel.`;
        passLabel = "wcag 2.1";
        statusBadge = `<span class="bp-tag">verified</span>`;
      }

      // Sweep split line across the window
      const splitPct = t < 16.5 ? 52 : (t < 17.5 ? 38 : 64);

      sceneRoot.innerHTML = `
        <div class="split-left"><h2>${leftText}</h2></div>
        <div class="split-right">
          <div class="bp-win sel-frame">
            <span class="sel-node tl"></span><span class="sel-node tr"></span><span class="sel-node bl"></span><span class="sel-node br"></span>
            <div class="bp-titlebar">
              <span>theme engine — paper vs liquid glass</span>
              <div class="bp-dots"><i></i><i></i><i></i></div>
            </div>
            <div class="bp-body" style="position:relative;background:#fff;">
              <!-- Right/Full Layer: Liquid Glass on Aurora -->
              <div class="fk-stage fk-theme-liquid" data-wall="aurora">
                ${renderFlyoutHTML("weather")}
                ${renderDockHTML("weather")}
              </div>
              <!-- Left Clipped Layer: Warm Paper on Meadow -->
              <div class="fk-stage fk-theme-paper" data-wall="meadow" style="clip-path:polygon(0 0, ${splitPct}% 0, ${splitPct}% 100%, 0 100%);">
                <div style="position:absolute;left:48px;top:50%;transform:translateY(-50%);width:360px;">
                  <div style="font-family:var(--mono);font-size:13px;color:#D95D39;font-weight:700;margin-bottom:8px;">PAPER THEME · EDITORIAL</div>
                  <div style="font-size:38px;font-weight:800;letter-spacing:-0.035em;line-height:1.08;color:#1F1E1B;">Warm solid surfaces &amp; crisp tokens.</div>
                </div>
                ${renderFlyoutHTML("weather")}
                ${renderDockHTML("weather")}
              </div>
              <!-- Vertical Split Divider Line -->
              <div style="position:absolute;top:0;bottom:0;left:${splitPct}%;width:3px;background:#357ABD;z-index:20;"></div>
              ${showInspectBoxes ? `
                <div style="position:absolute;right:98px;top:92px;width:350px;height:360px;border:2px dashed #D93829;z-index:25;pointer-events:none;"></div>
                <div style="position:absolute;right:14px;top:64px;width:84px;height:420px;border:2px dashed #D93829;z-index:25;pointer-events:none;"></div>
              ` : ``}
            </div>
            <div class="bp-titlebar" style="border-top:1px solid rgba(0,0,0,0.1);border-bottom:0;">
              <div style="display:flex;align-items:center;gap:12px;">
                <span>${passLabel}</span>
                ${statusBadge}
              </div>
              <span>1920 × 1080 · 7 bundled themes</span>
            </div>
          </div>
        </div>
      `;
      return;
    }

    // =========================================================================
    // SCENE 7: 19.30s - 22.90s (Dark Terminal Checklist: "Private down to the last byte.")
    // =========================================================================
    if (t < 22.90) {
      const checks = [
        "Store 100% locally in %APPDATA%\\Flank",
        "Zero telemetry, zero analytics servers",
        "Skip password manager clips automatically",
        "Win32 SWP_NOACTIVATE (never steals focus)",
        "Auto-collapse during full-screen games",
        "Live tray icon & instant global hotkeys"
      ];
      const elapsed = t - 19.45;

      sceneRoot.innerHTML = `
        <div class="split-left">
          <h2>Private down to the<br><span class="hl-box">last byte.</span></h2>
        </div>
        <div class="split-right">
          <div class="bp-win sel-frame" style="background:#14161B;border-color:#2B2F3A;">
            <span class="sel-node tl"></span><span class="sel-node tr"></span><span class="sel-node bl"></span><span class="sel-node br"></span>
            <div class="bp-titlebar" style="background:#1A1D24;color:#8B92A5;border-color:#2B2F3A;">
              <span>flank — verify</span>
              <div class="bp-dots"><i style="border-color:#8B92A5;"></i><i style="border-color:#8B92A5;"></i><i style="border-color:#8B92A5;"></i></div>
            </div>
            <div class="bp-body" style="padding:42px 48px;font-family:var(--mono);font-size:25px;color:#F1F0EC;display:flex;flex-direction:column;gap:22px;">
              ${checks.map((line, i) => {
                const startT = i * 0.36;
                const checked = elapsed >= startT + 0.18;
                const chars = Math.floor(clamp((elapsed - startT) / 0.32, 0, 1) * line.length);
                return `
                  <div style="display:flex;align-items:center;gap:16px;">
                    <span style="color:${checked ? "#76B9FF" : "#555B6E"};">[${checked ? "x" : " "}]</span>
                    <span>${line.slice(0, Math.max(0, chars))}</span>
                  </div>
                `;
              }).join("")}
              ${elapsed >= 2.30 ? `
                <div style="margin-top:12px;display:flex;align-items:center;gap:18px;font-size:26px;">
                  <span style="color:#8B92A5;">verdict:</span>
                  <span style="background:#76B9FF;color:#14161B;font-weight:700;padding:4px 16px;">READY</span>
                </div>
              ` : ``}
            </div>
          </div>
        </div>
      `;

      if (t >= 22.35) {
        drawPixelWipe((t - 22.35) / 0.95, "rtl", false);
      }
      return;
    }

    // =========================================================================
    // SCENE 8: 22.90s - 28.80s ("8 widgets. One glance each." Rapid 01/06..06/06 Showcase)
    // =========================================================================
    if (t < 28.80) {
      if (t < 23.35) {
        drawPixelWipe(0.55 + ((t - 22.90) / 0.45) * 0.45, "rtl", false);
      }

      const slides = [
        { num: "01 / 06", theme: "fk-theme-liquid", wall: "aurora", widget: "weather", title: "Weather · Live 5-hour forecast", sub: "Hover the sun tile for Kyoto temperature & hourly strip." },
        { num: "02 / 06", theme: "fk-theme-paper", wall: "meadow", widget: "focus", title: "Focus Timer · Pomodoro presets", sub: "15m, 25m and 45m deep work sessions right on your screen edge." },
        { num: "03 / 06", theme: "fk-theme-aurora", wall: "sunset", widget: "audio", title: "Audio & Mic Mixer · Instant mute", sub: "Slide master volume or toggle microphone mute mid-call." },
        { num: "04 / 06", theme: "fk-theme-nord", wall: "graphite", widget: "stats", title: "System Telemetry · Live sparkline", sub: "Real-time CPU load, memory pressure and network throughput." },
        { num: "05 / 06", theme: "fk-theme-liquid", wall: "aurora", widget: "agenda", title: "Agenda · One-click meeting join", sub: "See your next calendar event countdown and launch Meet or Zoom." },
        { num: "06 / 06", theme: "fk-theme-terminal", wall: "graphite", widget: "clock", title: "World Clock & Global Shortcuts", sub: "Track 3 timezones and trigger any tile with Alt + 1..9." }
      ];

      const idx = clamp(Math.floor((t - 23.30) / 0.90), 0, slides.length - 1);
      const s = slides[idx];

      sceneRoot.innerHTML = `
        <div class="split-left">
          <h2><span class="hl-box">8 widgets.</span><br>One glance each.</h2>
        </div>
        <div class="split-right">
          <div class="bp-win sel-frame">
            <span class="sel-node tl"></span><span class="sel-node tr"></span><span class="sel-node bl"></span><span class="sel-node br"></span>
            <div class="bp-titlebar">
              <span>${s.title}</span>
              <span class="bp-tag">${s.num}</span>
            </div>
            <div class="bp-body">
              <div class="fk-stage ${s.theme}" data-wall="${s.wall}">
                <div style="position:absolute;left:44px;bottom:44px;max-width:440px;background:rgba(15,18,28,0.68);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.2);padding:20px 24px;border-radius:18px;color:#fff;">
                  <div style="font-family:var(--mono);font-size:12px;color:#76B9FF;margin-bottom:6px;">LIVE PREVIEW · ${s.num}</div>
                  <div style="font-size:22px;font-weight:700;margin-bottom:4px;">${s.title}</div>
                  <div style="font-size:14px;opacity:0.82;">${s.sub}</div>
                </div>
                ${renderFlyoutHTML(s.widget)}
                ${renderDockHTML(s.widget)}
              </div>
            </div>
          </div>
        </div>
      `;
      return;
    }

    // =========================================================================
    // SCENE 9: 28.80s - 31.10s (Connection Diagram: [ Windows 11 ] ── 🔗 ── [ Flank ])
    // =========================================================================
    if (t < 31.10) {
      const lineP = easeOutCubic((t - 28.95) / 0.45);
      const subA = easeOutCubic((t - 29.55) / 0.40);

      sceneRoot.innerHTML = `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;">
          <div style="display:flex;align-items:center;gap:0;">
            <div style="border:2px solid #357ABD;background:#FFFFFF;padding:18px 42px;font-size:38px;font-weight:500;">
              Windows 11
            </div>
            <div style="width:${Math.round(220 * lineP)}px;height:2px;background:#357ABD;position:relative;display:flex;align-items:center;justify-content:center;overflow:visible;">
              ${lineP > 0.5 ? `
                <div style="width:52px;height:52px;border-radius:50%;background:#76B9FF;display:flex;align-items:center;justify-content:center;color:#1F1E1B;box-shadow:0 4px 14px rgba(83,157,245,0.4);">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                </div>
              ` : ``}
            </div>
            <div class="hl-box" style="padding:18px 46px;font-family:var(--mono);font-size:38px;font-weight:700;margin:0;">
              Flank
            </div>
          </div>
          <div style="font-size:34px;font-weight:500;color:var(--fg);opacity:${subA};transform:translateY(${(1 - subA) * 10}px);">
            One dock. Every workflow.
          </div>
        </div>
      `;

      if (t >= 30.65) {
        drawPixelWipe((t - 30.65) / 0.90, "ltr", false);
      }
      return;
    }

    // =========================================================================
    // SCENE 10: 31.10s - 35.05s (Outro: Flank Lockup + Interactive Download CTA + Cursor Click)
    // =========================================================================
    if (t < 31.55) {
      drawPixelWipe(0.5 + ((t - 31.10) / 0.45) * 0.5, "ltr", false);
    }

    const cmdString = "Flank-Setup.exe  ·  Windows 11";
    const typedLen = Math.floor(clamp((t - 31.75) / 1.15, 0, 1) * cmdString.length);
    const isClicked = t >= 33.75;
    const subVisible = easeOutCubic((t - 32.85) / 0.4);

    // Cursor animation gliding in to click the button (relative to button)
    const curP = easeOutCubic((t - 32.90) / 0.80);
    const curDx = (1 - curP) * 140;
    const curDy = (1 - curP) * 120;

    sceneRoot.innerHTML = `
      <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;">
        <div style="display:flex;align-items:center;gap:26px;">
          ${BRAND_ICON(96)}
          ${BRAND_WORDMARK(92, "#1F1E1B")}
        </div>

        <div class="hl-box" style="padding:14px 24px;display:inline-flex;align-items:center;gap:22px;font-family:var(--mono);font-size:28px;font-weight:600;">
          <span>↓ ${cmdString.slice(0, Math.max(1, typedLen))}</span>
          <span style="position:relative;background:${isClicked ? "#FFFFFF" : "#1F1E1B"};color:${isClicked ? "#1F1E1B" : "#FFFFFF"};padding:8px 18px;border-radius:6px;font-size:20px;font-weight:700;transform:scale(${isClicked ? 0.96 : 1});">
            ${isClicked ? "ready ✓" : "download"}
            ${t >= 32.90 ? `
              <span style="position:absolute;right:${-12 - curDx}px;bottom:${-18 - curDy}px;z-index:40;pointer-events:none;transform:scale(${isClicked && t < 33.95 ? 0.86 : 1});display:block;">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="#1F1E1B" stroke="#FFFFFF" stroke-width="1.5">
                  <path d="M4 3l16 7-7 2-2 7z"/>
                </svg>
              </span>
            ` : ``}
          </span>
        </div>

        <div style="font-size:28px;color:var(--muted);opacity:${subVisible};">
          The second dock Windows never shipped. Free &amp; open source.
        </div>
      </div>
    `;
  }

  // Expose deterministic API for headless 60fps video rendering
  let playing = true;
  let currentTime = 0;
  let lastTs = performance.now();

  window.setVideoTime = function(t) {
    playing = false;
    document.body.classList.add("headless");
    viewport.style.transform = "none";
    currentTime = clamp(t, 0, DURATION);
    renderAtTime(currentTime);
  };

  // Interactive browser playback loop
  const playPauseBtn = document.getElementById("playPauseBtn");
  const scrubInput = document.getElementById("scrubInput");
  const timeLabel = document.getElementById("timeLabel");

  playPauseBtn.addEventListener("click", () => {
    playing = !playing;
    playPauseBtn.textContent = playing ? "PAUSE" : "PLAY";
    lastTs = performance.now();
  });

  scrubInput.addEventListener("input", () => {
    playing = false;
    playPauseBtn.textContent = "PLAY";
    currentTime = parseFloat(scrubInput.value);
    renderAtTime(currentTime);
    timeLabel.textContent = `${currentTime.toFixed(1).padStart(4, "0")}s / ${DURATION.toFixed(1)}s`;
  });

  function tick(now) {
    if (playing && !document.body.classList.contains("headless")) {
      const dt = (now - lastTs) / 1000;
      lastTs = now;
      currentTime = (currentTime + dt) % DURATION;
      renderAtTime(currentTime);
      scrubInput.value = currentTime.toFixed(2);
      timeLabel.textContent = `${currentTime.toFixed(1).padStart(4, "0")}s / ${DURATION.toFixed(1)}s`;
    }
    requestAnimationFrame(tick);
  }
  renderAtTime(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
