<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flank Rail Theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 720px; height: 520px; overflow: hidden; font-family: 'Inter','Segoe UI',system-ui,sans-serif; color: #eceef3; background: #1d2a44">

<!-- dusk wallpaper -->
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(165deg, #1a2540 0%, #392c56 42%, #a0526a 78%, #e29a6c 100%)"></div>
<svg aria-hidden="true" width="720" height="200" viewBox="0 0 720 200" style="position: absolute; left: 0; bottom: 0" preserveAspectRatio="none"><path d="M0 120 L90 70 L170 110 L260 50 L360 104 L450 66 L560 112 L640 82 L720 118 L720 200 L0 200 Z" fill="#0f1422"/><path d="M0 160 L110 126 L220 150 L340 118 L470 152 L600 130 L720 156 L720 200 L0 200 Z" fill="#0a0e19"/></svg>

<!-- RAIL -->
<nav aria-label="Flank rail" style="position: absolute; right: 0; top: 40px; width: 40px; height: 430px; box-sizing: border-box; padding: 14px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(14,16,24,0.7); backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.08); border-right: 0; border-radius: 14px 0 0 14px">
  <button aria-label="Terminal" style="width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c9cedb; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg></button>
  <button aria-label="Browser" style="width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c9cedb; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/></svg></button>
  <button aria-label="Files" style="width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c9cedb; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <div aria-hidden="true" style="width: 18px; height: 1px; background: rgba(255,255,255,0.14)"></div>
  <button aria-label="Clipboard history, 24 items" style="position: relative; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c9cedb; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg><span style="position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 4px; background: {{accent}}"></span></button>
  <button aria-label="Weather 24 degrees" style="width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #eceef3; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">24°</button>
  <button aria-label="CPU 23 percent" style="width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #eceef3; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">23%</button>
  <button aria-label="Mini player, open" style="position: relative; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: rgba(255,255,255,0.1); color: {{accent}}; display: flex; align-items: center; justify-content: center">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="3.5" height="10" rx="1.2"/><rect x="10.2" y="4" width="3.5" height="16" rx="1.2"/><rect x="16.5" y="8" width="3.5" height="12" rx="1.2"/></svg>
    <span aria-hidden="true" style="position: absolute; right: -4px; top: 8px; width: 2px; height: 16px; border-radius: 1px; background: {{accent}}"></span>
  </button>
  <button aria-label="AI usage 68 percent" style="width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="10" stroke="rgba(255,255,255,0.18)" stroke-width="3"/><circle cx="14" cy="14" r="10" stroke="#eceef3" stroke-width="3" stroke-linecap="round" stroke-dasharray="42.7 62.8" transform="rotate(-90 14 14)"/></svg></button>
</nav>

<!-- MINI PLAYER CARD -->
<section aria-label="Mini player" style="position: absolute; right: 52px; top: 218px; width: 264px; box-sizing: border-box; padding: 14px; border-radius: 16px; background: rgba(14,16,24,0.78); backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 14px">
  <div aria-hidden="true" style="position: absolute; right: -6px; top: 81px; width: 10px; height: 10px; background: rgb(18,20,28); border-top: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); transform: rotate(45deg)"></div>
  <div style="display: flex; gap: 12px; align-items: center">
    <span aria-hidden="true" style="width: 60px; height: 60px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #e29a6c, #392c56); display: block"></span>
    <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 14px; font-weight: 600">Night Drive</span><span style="font-size: 12.5px; color: #b6bccb">Sample Artist</span><span style="font-size: 11.5px; color: #b6bccb">Now playing</span></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden"><div style="width: 38%; height: 100%; background: {{accent}}"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #b6bccb; font-variant-numeric: tabular-nums"><span>2:14</span><span>5:48</span></div>
  </div>
  <div style="display: flex; justify-content: center; align-items: center; gap: 22px; color: #eceef3">
    <button aria-label="Previous" style="width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button aria-label="Pause" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: {{accent}}; color: #1a0f10; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button aria-label="Next" style="width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A7A","options":["#FF8A7A","#5EEAD4","#C4B5FD","#FDE68A"]},"$preview":{"width":720,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF8A7A' };
  }
}
</script>
</body>
</html>
