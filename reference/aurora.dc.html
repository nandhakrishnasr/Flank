<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flank Aurora Theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 720px; height: 520px; overflow: hidden; font-family: 'Inter','Segoe UI',system-ui,sans-serif; color: #ffffff; background: #0b0618">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(420px 360px at 12% 20%, rgba(109,40,217,0.75), rgba(109,40,217,0) 70%), radial-gradient(380px 340px at 90% 18%, rgba(219,39,119,0.55), rgba(219,39,119,0) 70%), radial-gradient(460px 380px at 60% 100%, rgba(6,182,212,0.5), rgba(6,182,212,0) 70%), #0b0618"></div>

<!-- TOP CAPSULE DOCK -->
<nav aria-label="Flank dock" style="position: absolute; left: 50px; top: 28px; width: 620px; height: 64px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 32px; background: rgba(22,10,46,0.55); backdrop-filter: blur(26px) saturate(150%); border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 0 44px rgba(167,92,255,0.35), inset 0 1px 0 rgba(255,255,255,0.18)">
  <button aria-label="Terminal" style="width: 38px; height: 38px; padding: 0; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg></button>
  <button aria-label="Browser" style="width: 38px; height: 38px; padding: 0; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/></svg></button>
  <button aria-label="Files" style="width: 38px; height: 38px; padding: 0; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button aria-label="Notes" style="width: 38px; height: 38px; padding: 0; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></button>
  <div aria-hidden="true" style="width: 1px; height: 28px; margin: 0 6px; background: rgba(255,255,255,0.25)"></div>
  <button aria-label="Weather, Kyoto 24 degrees" style="height: 38px; padding: 0 14px 0 11px; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>24° Kyoto</button>
  <button aria-label="CPU 23 percent" style="width: 38px; height: 38px; padding: 0; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="10" stroke="rgba(255,255,255,0.22)" stroke-width="3"/><circle cx="14" cy="14" r="10" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-dasharray="14.4 62.8" transform="rotate(-90 14 14)"/><text x="14" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Inter, sans-serif">23</text></svg></button>
  <button aria-label="Now playing, Night Drive" style="height: 38px; padding: 0 14px 0 12px; border: 0; border-radius: 19px; background: rgba(255,255,255,0.12); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 9px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#f0abfc" aria-hidden="true"><rect x="4" y="10" width="3.5" height="10" rx="1.2"/><rect x="10.2" y="4" width="3.5" height="16" rx="1.2"/><rect x="16.5" y="8" width="3.5" height="12" rx="1.2"/></svg>Night Drive</button>
  <button aria-label="AI usage, open" style="height: 38px; padding: 0 14px 0 8px; border: 0; border-radius: 19px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; box-shadow: 0 0 20px rgba(219,39,119,0.5)"><svg width="24" height="24" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="10" stroke="rgba(255,255,255,0.35)" stroke-width="3"/><circle cx="14" cy="14" r="10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="42.7 62.8" transform="rotate(-90 14 14)"/></svg>68%</button>
</nav>

<!-- AI USAGE CARD -->
<section aria-label="AI usage" style="position: absolute; right: 48px; top: 106px; width: 316px; box-sizing: border-box; padding: 18px; border-radius: 22px; background: rgba(22,10,46,0.62); backdrop-filter: blur(26px) saturate(150%); border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 0 44px rgba(167,92,255,0.3), 0 24px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 16px">
  <div aria-hidden="true" style="position: absolute; right: 60px; top: -7px; width: 12px; height: 12px; background: rgb(40,22,72); border-top: 1px solid rgba(255,255,255,0.22); border-left: 1px solid rgba(255,255,255,0.22); transform: rotate(45deg)"></div>
  <div style="display: flex; align-items: center; gap: 16px">
    <svg width="88" height="88" viewBox="0 0 88 88" fill="none" role="img" aria-label="68 percent of the usage limit used"><defs><linearGradient id="auroraRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><circle cx="44" cy="44" r="34" stroke="rgba(255,255,255,0.16)" stroke-width="9"/><circle cx="44" cy="44" r="34" stroke="url(#auroraRing)" stroke-width="9" stroke-linecap="round" stroke-dasharray="145.3 213.6" transform="rotate(-90 44 44)"/><text x="44" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" font-family="Inter, sans-serif">68%</text></svg>
    <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600">AI usage</span><span style="font-size: 12.5px; color: #ddd3f5">This week · resets in 3 days</span></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 11px">
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #ddd3f5">Chat</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">72%</span></div><div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden"><div style="width: 72%; height: 100%; background: linear-gradient(90deg, #f472b6, #8b5cf6)"></div></div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #ddd3f5">Code</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">54%</span></div><div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden"><div style="width: 54%; height: 100%; background: linear-gradient(90deg, #f472b6, #8b5cf6)"></div></div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: #ddd3f5">Agents</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">31%</span></div><div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden"><div style="width: 31%; height: 100%; background: linear-gradient(90deg, #f472b6, #8b5cf6)"></div></div></div>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
